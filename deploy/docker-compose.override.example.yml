# Example: run oauth2-proxy next to tesla-hub. Copy to ../docker-compose.override.yml
# (git-ignored; docker compose picks it up automatically) and adjust.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: tesla-hub-oauth2-proxy
    restart: unless-stopped
    network_mode: host            # listens on 127.0.0.1:4180 for the host's nginx
    env_file: [./oauth2-proxy.env]   # OAUTH2_PROXY_CLIENT_SECRET=..., OAUTH2_PROXY_COOKIE_SECRET=...
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    volumes:
      - ./deploy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
      - ./deploy/emails.txt:/etc/oauth2-proxy/emails.txt:ro
